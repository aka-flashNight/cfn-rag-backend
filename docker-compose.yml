# ============================================================================
# CFN-RAG Backend Docker Compose 全栈部署
#
# 使用方式:
#   # 仅启动依赖服务（Redis + Qdrant + Postgres），后端仍在本地开发
#   docker-compose up -d redis qdrant postgres
#
#   # 全栈启动（包含后端和 Worker）
#   docker-compose --profile full up -d
#
#   # 查看日志
#   docker-compose logs -f backend
# ============================================================================

version: "3.9"

services:
  # ---- 后端 API 服务 ----
  backend:
    build: .
    container_name: cfn-rag-backend
    ports:
      - "7077:7077"
    environment:
      - CFN_PROFILE=server
      - CFN_DB_BACKEND=postgres
      - CFN_CACHE_BACKEND=redis
      - CFN_VECTOR_BACKEND=qdrant
      - CFN_REDIS_URL=redis://redis:6379/0
      - CFN_POSTGRES_URL=postgresql+asyncpg://postgres:postgres@postgres:5432/cfn_rag
      - CFN_QDRANT_URL=http://qdrant:6333
      - CFN_WORKER_BROKER_URL=redis://redis:6379/1
      - CFN_LANGGRAPH_CHECKPOINT_DB=/app/resources/tools/langgraph_checkpoint.sqlite
    volumes:
      - ./models:/app/models:ro
      - ./resources:/app/resources
      - backend_data:/app/.llamaindex_cache
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped
    profiles: ["full"]

  # ---- 后台 Worker ----
  worker:
    build: .
    container_name: cfn-rag-worker
    command: python worker/main.py
    environment:
      - CFN_PROFILE=server
      - CFN_REDIS_URL=redis://redis:6379/0
      - CFN_WORKER_BROKER_URL=redis://redis:6379/1
      - CFN_QDRANT_URL=http://qdrant:6333
    volumes:
      - ./models:/app/models:ro
      - ./resources:/app/resources
    env_file:
      - .env
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    profiles: ["full"]

  # ---- Redis（缓存 + 任务队列 broker） ----
  redis:
    image: redis:7-alpine
    container_name: cfn-rag-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 128mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---- Qdrant（向量数据库） ----
  qdrant:
    image: qdrant/qdrant:v1.9.0
    container_name: cfn-rag-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped

  # ---- PostgreSQL（关系数据库） ----
  postgres:
    image: postgres:16-alpine
    container_name: cfn-rag-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=cfn_rag
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cfn_rag"]
      interval: 10s
      timeout: 3s
      retries: 3
    restart: unless-stopped

  # ---- Jaeger（分布式追踪，可选） ----
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: cfn-rag-jaeger
    ports:
      - "16686:16686"  # Web UI
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped
    profiles: ["observability"]

volumes:
  backend_data:
  redis_data:
  qdrant_data:
  postgres_data:
