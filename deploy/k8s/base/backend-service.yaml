apiVersion: v1
kind: Service
metadata:
  name: cfn-rag-backend
  labels:
    app: cfn-rag-backend
spec:
  type: ClusterIP
  # SSE 长连接需要 session affinity
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 3600
  ports:
    - port: 7077
      targetPort: 7077
      protocol: TCP
      name: http
  selector:
    app: cfn-rag-backend
