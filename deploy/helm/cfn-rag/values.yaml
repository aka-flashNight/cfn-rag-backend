# CFN-RAG Backend Helm Chart 默认值
# 分环境覆盖：values.local.yaml（minikube）、values.prod.yaml（阿里云 ACK）

# 副本数
replicaCount: 1
workerReplicaCount: 1

# 镜像配置
image:
  repository: cfn-rag-backend
  tag: latest
  pullPolicy: IfNotPresent

# 服务配置
service:
  type: ClusterIP
  port: 7077

# Ingress（默认不启用，minikube 用 port-forward）
ingress:
  enabled: false
  host: cfn-rag.local
  className: nginx

# HPA（默认不启用，minikube 单节点）
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 70

# 资源限制
resources:
  backend:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  worker:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# 存储
persistence:
  models:
    size: 2Gi
  resources:
    size: 1Gi

# 环境配置
env:
  CFN_PROFILE: server
  CFN_DB_BACKEND: postgres
  CFN_CACHE_BACKEND: redis
  CFN_VECTOR_BACKEND: qdrant
  CFN_CHECKPOINT_BACKEND: postgres
  CFN_REDIS_URL: redis://redis:6379/0
  CFN_POSTGRES_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/cfn_rag
  CFN_QDRANT_URL: http://qdrant:6333
  CFN_QDRANT_COLLECTION: cfn_game
  CFN_WORKER_BROKER_URL: redis://redis:6379/1
  CFN_LANGGRAPH_CHECKPOINT_DB: /app/resources/tools/langgraph_checkpoint.sqlite

# Secrets（生产环境通过 sealed-secrets 管理，此处仅占位）
secrets:
  LLM_API_KEY: ""
  LLM_API_BASE: "https://generativelanguage.googleapis.com/v1beta/openai/"
  LLM_MODEL_NAME: "gemini-2.5-flash"

# 外部依赖（默认使用内置服务，可覆盖为云服务 URL）
dependencies:
  redis:
    enabled: true
    image: redis:7-alpine
  qdrant:
    enabled: true
    image: qdrant/qdrant:v1.9
  postgres:
    enabled: true
    image: postgres:16-alpine
    storage: 10Gi
